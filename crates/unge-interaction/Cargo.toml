[package]
name = "unge-interaction"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
[dependencies]
unge-core = { path = "../unge-core" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[features]
schema = ["dep:schemars", "unge-core/schema"]

[dependencies.schemars]
version = "=0.8.22"
optional = true
features = ["uuid1"]
