name: Rust checks
on: [push, pull_request]
jobs:
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-features --locked
      - run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings
      - run: cargo run --locked -p unge-headless
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check examples/tauri-host/ui/app.js
      - run: node --check examples/tauri-host/ui/panels.js
      - run: node scripts/test_panels_ui.cjs
      - run: node --check examples/tauri-host/ui/accessibility.js
      - run: node --check examples/tauri-host/ui/properties.js
      - run: node --check examples/tauri-host/ui/groups.js
      - run: node scripts/test_groups_ui.cjs
      - run: node scripts/test_accessibility_ui.cjs
      - run: node scripts/test_execution_ui.cjs
      - run: npx --yes --package typescript@5.9.3 tsc -p bindings/typescript
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'jsonschema>=4.18,<5'
      - run: cargo build --locked -p unge-acx-provider
      - run: python scripts/test_acx.py -v
      - run: python scripts/generate_contracts.py --check
      - run: python scripts/test_contracts.py -v
